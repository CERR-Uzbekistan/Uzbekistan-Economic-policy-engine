[project]
name = "uzbekistan-policy-mcp"
version = "0.1.0"
description = "MCP server exposing Uzbekistan's 6 macroeconomic policy models as AI-queryable tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "mcp[cli]==1.27.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "openpyxl==3.1.5",
]

[dependency-groups]
build = ["setuptools==80.9.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "models*", "helpers*", "tools*"]

[tool.setuptools]
py-modules = ["main", "mcp_security"]

[tool.ruff]
line-length = 100
extend-exclude = ["build", "pytest-cache-files-*", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
